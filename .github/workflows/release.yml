name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "dev"
    tags:
      - "v*.*.*"

jobs:
  build_plugin:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: install dependencies
        run: |
          pacman -Syu git npm rsync zip unzip --noconfirm
          git config --global --add safe.directory $(realpath .)

      - uses: actions/checkout@v4

      - name: build plugin
        run: |
          npm i -g pnpm
          pnpm install --no-frozen-lockfile
          pnpm run build
          rm -f dist/*.js.map
          tar -czvf hhd-decky.tar.gz --transform 's,^,hhd-decky/,' dist py_modules *.py *.json *.md *.js LICENSE
          mkdir -p hhd-decky
          rsync -av --ignore-missing-args dist py_modules *.py *.json *.md *.js LICENSE hhd-decky
          zip -r hhd-decky.zip hhd-decky
          rm -rf hhd-decky
        continue-on-error: true

      - name: show files
        run: |
          tar -tzvf hhd-decky.tar.gz
          unzip -l hhd-decky.zip

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hhd-decky
          path: |
            hhd-decky.tar.gz
            hhd-decky.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build_plugin
    steps:
      - run: mkdir /tmp/artifacts

      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - run: ls -R /tmp/artifacts

      - name: publish to github release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/artifacts/hhd-decky/hhd-decky.tar.gz
            /tmp/artifacts/hhd-decky/hhd-decky.zip
          tag_name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          prerelease: contains(github.ref, 'pre')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
